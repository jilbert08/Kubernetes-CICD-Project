name: CI/CD - Build, Push and Deploy to Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: cicd-demo

jobs:
  build-and-push:
    name: Test, build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (multi-stage Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create Kubernetes cluster (Kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: cicd-cluster

      - name: Show cluster
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Set image to this commit's tag
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          sed -i "s|image: .*|image: ${IMAGE}|" k8s/deployment.yaml
          grep "image:" k8s/deployment.yaml

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Wait for rollout
        run: kubectl rollout status deployment/cicd-demo --timeout=180s

      - name: Show deployed resources
        run: kubectl get deployments,replicasets,pods,services -o wide

      - name: Verify the app responds
        run: |
          kubectl port-forward service/cicd-demo-service 8080:80 > /dev/null 2>&1 &
          sleep 5
          echo "----- GET / -----"
          curl --retry 5 --retry-delay 2 --retry-connrefused -s http://localhost:8080/
          echo
          echo "----- GET /health -----"
          curl -s http://localhost:8080/health
          echo

      - name: Debug info (only if something failed)
        if: failure()
        run: |
          kubectl describe deployment cicd-demo
          kubectl get events --sort-by=.metadata.creationTimestamp
          kubectl logs deployment/cicd-demo --all-containers --tail=50
